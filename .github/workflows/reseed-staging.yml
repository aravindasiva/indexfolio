name: Reseed Staging DB

on:
  workflow_call:
    inputs:
      railway-service-id:
        required: true
        type: string
    secrets:
      railway-token:
        required: true
  # Manual trigger for when the normal deploy path can't apply a migration - e.g. a
  # destructive schema change where the API's startup migrate-deploy would fail on
  # existing staging data. Always targets staging.
  workflow_dispatch:

jobs:
  reseed:
    name: 'reset + reseed'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.4.2

      - name: Reset and reseed
        env:
          # From Bossman (workflow_call) or the staging secret (manual dispatch).
          RAILWAY_TOKEN: ${{ secrets.railway-token || secrets.RAILWAY_TOKEN_STAGING }}
        # `railway run` injects the service's variables (incl. DATABASE_URL) from Railway,
        # so no duplicated secret. db reset = `prisma migrate reset --force`: drop, migrate, seed.
        run: |
          railway run --service ${{ inputs.railway-service-id || vars.RAILWAY_API_STAGING_SERVICE_ID }} -- \
            pnpm --filter @indexfolio/db reset
          echo "## 🌱 Staging DB reset + reseeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dropped, re-migrated, and reseeded from \`packages/db/prisma/data\`." >> "$GITHUB_STEP_SUMMARY"
