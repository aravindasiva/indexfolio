version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    target-branch: 'dev'
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    target-branch: 'dev'
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore'
    labels:
      - 'dependencies'
    groups:
      npm-patch-minor:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Major version bumps need manual review and dedicated testing
      - dependency-name: 'turbo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: 'fastify-type-provider-zod'
        update-types: ['version-update:semver-major']
      # @types/node should track Node.js major version (currently Node 20)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Next.js major upgrades need dedicated migration testing
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      # Dev tooling major bumps -- low urgency, handle manually
      - dependency-name: '@commitlint/cli'
        update-types: ['version-update:semver-major']
      - dependency-name: '@commitlint/config-conventional'
        update-types: ['version-update:semver-major']
      - dependency-name: 'lint-staged'
        update-types: ['version-update:semver-major']
