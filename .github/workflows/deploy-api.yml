name: Deploy API

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      railway-service-id:
        required: true
        type: string
    secrets:
      railway-token:
        required: true

jobs:
  deploy:
    name: 'api → ${{ inputs.environment }}'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.4.2

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.railway-token }}
        # `railway up` uploads can hit a transient 429 (Railway rate limit), so
        # retry with linear backoff before failing.
        run: |
          attempts=5
          n=1
          until railway up --service ${{ inputs.railway-service-id }}; do
            if [ "$n" -ge "$attempts" ]; then
              echo "::error::railway up failed after $attempts attempts"
              exit 1
            fi
            wait=$((n * 15))
            echo "::warning::railway up failed (attempt $n/$attempts) - retrying in ${wait}s (usually a transient 429)"
            sleep "$wait"
            n=$((n + 1))
          done
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "🚀 API live at https://api.indexfolio.dev"
            echo "## 🚀 API deployed to production" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Live:** https://api.indexfolio.dev" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🧪 API live at https://staging.api.indexfolio.dev"
            echo "## 🧪 API deployed to staging" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Staging:** https://staging.api.indexfolio.dev" >> "$GITHUB_STEP_SUMMARY"
          fi
