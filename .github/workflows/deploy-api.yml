name: Deploy API

on:
    workflow_call:
        inputs:
            environment:
                required: true
                type: string
            railway-service-id:
                required: true
                type: string

jobs:
    deploy:
        name: "🚢 Shipping API to Railway ${{ inputs.environment }}"
        runs-on: ubuntu-latest
        environment: ${{ inputs.environment }}

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/indexfolio-api:${{ inputs.environment }}-latest
                      ghcr.io/${{ github.repository_owner }}/indexfolio-api:${{ github.sha }}
                  cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/indexfolio-api:${{ inputs.environment }}-latest
                  cache-to: type=inline

            - name: Install Railway CLI
              run: npm install -g @railway/cli

            - name: Deploy to Railway
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: |
                  railway up \
                    --service ${{ inputs.railway-service-id }} \
                    --environment ${{ inputs.environment }} \
                    --image ghcr.io/${{ github.repository_owner }}/indexfolio-api:${{ github.sha }}
