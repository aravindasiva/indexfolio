name: Deploy Web

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: 'web → ${{ inputs.environment }}'
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@indexfolio/knowledge-graph --filter=@indexfolio/tax-engine --filter=@indexfolio/etf-types

      - name: Pull Vercel environment
        run: pnpm exec vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        # Sentry source-map upload runs inside `next build` (via withSentryConfig).
        # It only uploads when SENTRY_AUTH_TOKEN is present, so this is a no-op until set.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: pnpm exec vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          # --archive=tgz uploads the prebuilt output as one tarball instead of hundreds
          # of per-file PUTs, which intermittently failed with "Upload aborted". Retry with backoff.
          attempts=5
          n=1
          until deploy_url=$(pnpm exec vercel deploy --prebuilt --archive=tgz ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}); do
            if [ "$n" -ge "$attempts" ]; then
              echo "::error::vercel deploy failed after $attempts attempts"
              exit 1
            fi
            wait=$((n * 15))
            echo "::warning::vercel deploy failed (attempt $n/$attempts) - retrying in ${wait}s (usually a transient 'Upload aborted')"
            sleep "$wait"
            n=$((n + 1))
          done
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "🚀 Web live at https://www.indexfolio.dev"
            echo "## 🚀 Web deployed to production" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Deployment:** $deploy_url" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Live:** https://www.indexfolio.dev" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🧪 Web live at https://staging.indexfolio.dev"
            echo "## 🧪 Web deployed to staging" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Deployment:** $deploy_url" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Staging:** https://staging.indexfolio.dev" >> "$GITHUB_STEP_SUMMARY"
          fi
