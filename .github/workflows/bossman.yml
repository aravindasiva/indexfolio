name: Bossman

run-name: '🤖 Bossman on ${{ github.ref_name }} by @${{ github.actor }}'

on:
  push:
    branches: [dev, main]

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  detect-changes:
    name: '🔍 Detecting changes'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      seed: ${{ steps.filter.outputs.seed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Check paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            # api imports no workspace package today; if it takes one, add
            # 'packages/<name>/**' here. prisma/data and seed.ts run at reseed time, not in the build.
            api:
              - 'apps/api/**'
              - '!apps/api/prisma/data/**'
              - '!apps/api/prisma/seed.ts'
            # web consumes the shared packages, so any package change rebuilds web.
            web:
              - 'apps/web/**'
              - 'packages/**'
            seed:
              - 'apps/api/prisma/data/**'
              - 'apps/api/prisma/seed.ts'

  deploy-api:
    name: '🚢 Shipping API to Railway'
    needs: [checks, detect-changes]
    if: needs.detect-changes.outputs.api == 'true'
    # One API deployment at a time per branch: queue, never cancel mid-deploy.
    concurrency:
      group: deploy-api-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-api.yml
    permissions:
      contents: read
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      railway-service-id: ${{ github.ref == 'refs/heads/main' && vars.RAILWAY_API_PRODUCTION_SERVICE_ID || vars.RAILWAY_API_STAGING_SERVICE_ID }}
    secrets:
      railway-token: ${{ github.ref == 'refs/heads/main' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}

  reseed-staging:
    name: '🌱 Reseeding the staging DB'
    needs: [checks, detect-changes, deploy-api]
    # Staging only, when seed data/script changed, after a healthy API deploy (so
    # the schema is current). Hard-wired to the dev branch + staging service/token; never touches prod.
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      needs.checks.result == 'success' &&
      needs.detect-changes.outputs.seed == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    # One reseed at a time; never cancel a reset mid-run.
    concurrency:
      group: reseed-staging-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/reseed-staging.yml
    permissions:
      contents: read
    with:
      railway-service-id: ${{ vars.RAILWAY_API_STAGING_SERVICE_ID }}
    secrets:
      railway-token: ${{ secrets.RAILWAY_TOKEN_STAGING }}

  deploy-web:
    name: '🚀 Shipping Web to Vercel'
    needs: [checks, detect-changes, deploy-api, reseed-staging]
    # One web deployment at a time per branch: queue, never cancel mid-deploy.
    concurrency:
      group: deploy-web-${{ github.ref }}
      cancel-in-progress: false
    # Wait for the staging reseed so the build pre-renders ETF pages + sitemap against
    # fresh data; proceed when reseed was skipped (web-only changes, or main where reseed never runs).
    if: |
      always() &&
      needs.checks.result == 'success' &&
      needs.detect-changes.outputs.web == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.reseed-staging.result == 'success' || needs.reseed-staging.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    secrets: inherit
