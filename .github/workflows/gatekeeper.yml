name: Gatekeeper

run-name: '🛡️ Gatekeeper guarding PR #${{ github.event.pull_request.number }} → ${{ github.event.pull_request.title }}'

on:
  pull_request:
    branches: [main, dev]

# Cancel an in-flight run when new commits land on the same PR.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  preview:
    name: '🔎 Previewing on Vercel'
    needs: checks
    # Forks do not get secrets, so the deploy would fail -- only run on PRs from
    # this repo. Replaces Vercel's own Git auto-preview now that Actions owns deploys.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@indexfolio/knowledge-graph --filter=@indexfolio/tax-engine --filter=@indexfolio/etf-types

      - name: Pull Vercel environment
        run: pnpm exec vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          deploy_url=$(pnpm exec vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "🔎 Preview live at $deploy_url"
          echo "## 🔎 Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Preview:** $deploy_url" >> "$GITHUB_STEP_SUMMARY"
