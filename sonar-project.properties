sonar.projectKey=aravindasiva_indexfolio
sonar.organization=aravindasiva
sonar.projectName=indexfolio
sonar.projectVersion=1.0
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude generated artifacts, build outputs, CI config, and non-source files.
# Tooling config files (eslint, commitlint, etc.) are excluded - they are not product code.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/.turbo/**,**/coverage/**,.github/**,**/eslint.config.mjs,commitlint.config.cjs

# Only tax-engine has tests in Phase 1. Exclude everything else from coverage tracking.
# Test files and config files are also excluded - they should not count against coverage metrics.
sonar.coverage.exclusions=apps/**,workers/**,packages/knowledge-graph/**,packages/etf-types/**,**/__tests__/**,**/*.test.ts,**/*.spec.ts,commitlint.config.cjs

# Duplication runs automatically. Exclude the ETF seed data: it is intentionally
# one similar object per fund (data, not copy-pasted logic).
sonar.cpd.exclusions=**/prisma/data/**

# LCOV report generated by vitest in the tax-engine package.
sonar.javascript.lcov.reportPaths=packages/tax-engine/coverage/lcov.info

# Disable S6759 (mark component props as Readonly). It is a style opinion, not a
# bug. React freezes props at runtime, so the mutation it guards against cannot
# occur, and we do not wrap component props in Readonly across the repo.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx

# Ignore all rules in test code. Tests legitimately use hardcoded fixtures (fake
# URLs like http://test.local, sample tickers and values) that trip production
# rules such as S5332 (clear-text protocol). Test code is validated by running it
# (vitest) and by eslint, not by Sonar.
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/tests/**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/__tests__/**/*

# Disable S3863 on the OpenGraph route files only. They import the shared
# OG_SIZE/OG_CONTENT_TYPE and re-export them as Next's `size`/`contentType`
# metadata. `export const size = OG_SIZE` is the idiomatic route-metadata form
# and keeps the dimensions in one place; the rule's "use export...from"
# suggestion would mean an import+export shuffle or duplicating the values.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S3863
sonar.issue.ignore.multicriteria.e4.resourceKey=**/opengraph-image.tsx