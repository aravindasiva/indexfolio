name: Deploy API

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      railway-service-id:
        required: true
        type: string
    secrets:
      railway-token:
        required: true

jobs:
  deploy:
    name: 'api → ${{ inputs.environment }}'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.4.2

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.railway-token }}
        run: |
          railway up \
            --service ${{ inputs.railway-service-id }}
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "🚀 API live at https://api.indexfolio.dev"
            echo "## 🚀 API deployed to production" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Live:** https://api.indexfolio.dev" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🧪 API live at https://staging.api.indexfolio.dev"
            echo "## 🧪 API deployed to staging" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Staging:** https://staging.api.indexfolio.dev" >> "$GITHUB_STEP_SUMMARY"
          fi
