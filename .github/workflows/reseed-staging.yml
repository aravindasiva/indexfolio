name: Reseed Staging DB

on:
  workflow_call:
    inputs:
      railway-service-id:
        required: true
        type: string
    secrets:
      railway-token:
        required: true

jobs:
  reseed:
    name: 'reset + reseed'
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.4.2

      - name: Reset and reseed
        env:
          RAILWAY_TOKEN: ${{ secrets.railway-token }}
        # `railway run` injects the service's variables (incl. DATABASE_URL) from
        # Railway -- single source of truth, no duplicated secret. prisma:reset =
        # `prisma migrate reset --force`: drop -> migrate -> seed.
        run: |
          railway run --service ${{ inputs.railway-service-id }} -- \
            pnpm --filter @indexfolio/api prisma:reset
          echo "## 🌱 Staging DB reset + reseeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dropped, re-migrated, and reseeded from \`apps/api/prisma/data\`." >> "$GITHUB_STEP_SUMMARY"
