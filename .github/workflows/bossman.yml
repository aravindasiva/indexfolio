name: Bossman

run-name: '🤖 Bossman on ${{ github.ref_name }} by @${{ github.actor }}'

on:
  push:
    branches: [dev, main]

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  detect-changes:
    name: '🔍 Detecting changes'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      seed: ${{ steps.filter.outputs.seed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Check paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            # All-positive patterns: dorny negations don't exclude under the default
            # `some` quantifier, so each filter lists an app's real build inputs - its
            # own code, the workspace packages it imports, and shared root config.
            # api imports @indexfolio/db (only).
            api:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'turbo.json'
            # web imports etf-types/knowledge-graph/tax-engine (not db). A reseed also
            # rebuilds web via deploy-web's condition, so seed data is not listed here.
            web:
              - 'apps/web/**'
              - 'packages/etf-types/**'
              - 'packages/knowledge-graph/**'
              - 'packages/tax-engine/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'turbo.json'
            seed:
              - 'packages/db/prisma/data/**'
              - 'packages/db/prisma/seed.ts'

  deploy-api:
    name: '🚢 Shipping API to Railway'
    needs: [checks, detect-changes]
    if: needs.detect-changes.outputs.api == 'true'
    # One API deployment at a time per branch: queue, never cancel mid-deploy.
    concurrency:
      group: deploy-api-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-api.yml
    permissions:
      contents: read
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      railway-service-id: ${{ github.ref == 'refs/heads/main' && vars.RAILWAY_API_PRODUCTION_SERVICE_ID || vars.RAILWAY_API_STAGING_SERVICE_ID }}
    secrets:
      railway-token: ${{ github.ref == 'refs/heads/main' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}

  reseed-staging:
    name: '🌱 Reseeding the staging DB'
    needs: [checks, detect-changes, deploy-api]
    # Staging only, when seed data/script changed, after a healthy API deploy (so
    # the schema is current). Hard-wired to the dev branch + staging service/token; never touches prod.
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      needs.checks.result == 'success' &&
      needs.detect-changes.outputs.seed == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    # One reseed at a time; never cancel a reset mid-run.
    concurrency:
      group: reseed-staging-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/reseed-staging.yml
    permissions:
      contents: read
    with:
      railway-service-id: ${{ vars.RAILWAY_API_STAGING_SERVICE_ID }}
    secrets:
      railway-token: ${{ secrets.RAILWAY_TOKEN_STAGING }}

  deploy-web:
    name: '🚀 Shipping Web to Vercel'
    needs: [checks, detect-changes, deploy-api, reseed-staging]
    # One web deployment at a time per branch: queue, never cancel mid-deploy.
    concurrency:
      group: deploy-web-${{ github.ref }}
      cancel-in-progress: false
    # Rebuild web when its own inputs changed, OR when a staging reseed just ran (to
    # pre-render ETF pages + sitemap against the fresh data). Reseed only runs on dev,
    # so on main this reduces to "web inputs changed". Waits for api + reseed first.
    if: |
      always() &&
      needs.checks.result == 'success' &&
      (needs.detect-changes.outputs.web == 'true' || needs.reseed-staging.result == 'success') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.reseed-staging.result == 'success' || needs.reseed-staging.result == 'skipped')
    uses: ./.github/workflows/deploy-web.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    secrets: inherit

  notify-digest:
    name: '📮 Posting to #platform-digest'
    needs: [deploy-api, deploy-web]
    # Production only, and only when a service actually shipped (not skipped), so the muted
    # digest stays a high-signal record of prod releases. Isolated job, so it never blocks a deploy.
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy-api.result != 'skipped' || needs.deploy-web.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Post deploy summary to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_PLATFORM_DIGEST_WEBHOOK }}
          API_RESULT: ${{ needs.deploy-api.result }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # No webhook yet? Skip quietly rather than fail a good deploy.
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_PLATFORM_DIGEST_WEBHOOK not set - skipping digest post"
            exit 0
          fi
          mark() {
            case "$1" in
              success) printf '✅' ;;
              failure) printf '❌' ;;
              cancelled) printf '🚫' ;;
              *) printf '•' ;;
            esac
          }
          lines=""
          append() { lines="${lines}$1"$'\n'; }
          if [ "$API_RESULT" != "skipped" ]; then
            append "$(mark "$API_RESULT") **API** → https://api.indexfolio.dev"
          fi
          if [ "$WEB_RESULT" != "skipped" ]; then
            append "$(mark "$WEB_RESULT") **Web** → https://www.indexfolio.dev"
          fi
          color=5763719
          case "$API_RESULT $WEB_RESULT" in
            *failure*|*cancelled*) color=15548997 ;;
          esac
          desc="${lines}"$'\n'"by \`${ACTOR}\` | [run](${RUN_URL}) | \`${SHA:0:7}\`"
          jq -n --arg t '🚀 Platform deployed to production' --arg d "$desc" --argjson c "$color" \
            '{embeds:[{title:$t, description:$d, color:$c}]}' \
            | curl -sS -H 'Content-Type: application/json' -d @- "$WEBHOOK" -o /dev/null -w 'discord: %{http_code}\n' \
            || echo "::warning::failed to post to #platform-digest"
