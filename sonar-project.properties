sonar.projectKey=aravindasiva_indexfolio
sonar.organization=aravindasiva
sonar.projectName=indexfolio
sonar.projectVersion=1.0
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude generated artifacts, build output, CI config, tooling config, and vendored shadcn/ui
# primitives (components/ui is pulled from the registry and never hand-edited).
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/.turbo/**,**/coverage/**,.github/**,**/eslint.config.mjs,commitlint.config.cjs,**/components/ui/**

# Only tax-engine has tests in Phase 1; exclude everything else from coverage.
# packages/db is schema + generated client + seed script/data (no unit-testable logic).
sonar.coverage.exclusions=apps/**,packages/knowledge-graph/**,packages/etf-types/**,packages/db/**,**/__tests__/**,**/*.test.ts,**/*.spec.ts,commitlint.config.cjs

# Exclude ETF seed data from duplication: intentionally one similar object per fund (data, not logic).
sonar.cpd.exclusions=**/prisma/data/**

# LCOV report generated by vitest in the tax-engine package.
sonar.javascript.lcov.reportPaths=packages/tax-engine/coverage/lcov.info

# Disable S6759 (Readonly props): a style opinion, not a bug. React freezes props at runtime.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.tsx

# Ignore all rules in test code: fixtures (fake URLs, sample tickers) trip production
# rules like S5332. Tests are validated by vitest and eslint, not Sonar.
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/tests/**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/__tests__/**/*

# Disable S7763 (re-exports) on OG route files: `export const size = OG_SIZE` is the
# idiomatic Next route-metadata form and keeps dimensions in one place.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S7763
sonar.issue.ignore.multicriteria.e4.resourceKey=**/opengraph-image.tsx