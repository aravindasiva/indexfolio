name: Deploy Web

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@indexfolio/knowledge-graph --filter=@indexfolio/tax-engine --filter=@indexfolio/etf-types

      - name: Pull Vercel project settings
        working-directory: apps/web
        run: npx vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: apps/web
        run: npx vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Debug build output
        working-directory: apps/web
        run: |
          echo "=== .vercel/output size ==="
          du -sh .vercel/output/ 2>/dev/null || echo "NOT FOUND"
          echo "=== .vercel/output top-level ==="
          ls -la .vercel/output/ 2>/dev/null || echo "empty or missing"
          echo "=== config.json ==="
          cat .vercel/output/config.json 2>/dev/null || echo "no config.json"
          echo "=== static dir ==="
          ls .vercel/output/static/ 2>/dev/null | head -10 || echo "no static dir"

      - name: Deploy
        working-directory: apps/web
        run: npx vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
