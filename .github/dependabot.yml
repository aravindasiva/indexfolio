version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'dev'
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'dev'
    commit-message:
      prefix: 'chore'
    labels:
      - 'dependencies'
    groups:
      npm-patch-minor:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Major version bumps need manual review and dedicated testing
      - dependency-name: 'turbo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: 'fastify-type-provider-zod'
        update-types: ['version-update:semver-major']
