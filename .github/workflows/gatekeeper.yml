name: Gatekeeper

run-name: '👺 Gatekeeper guarding PR #${{ github.event.pull_request.number }} → ${{ github.event.pull_request.title }}'

on:
  pull_request:
    branches: [main, dev]

# Cancel an in-flight run when new commits land on the same PR.
concurrency:
  group: gatekeeper-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  detect-changes:
    name: '🔍 Detecting changes'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Check paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'

  preview:
    name: '👁️🫦👁️ Previewing on Vercel'
    needs: [checks, detect-changes]
    # Preview only for PRs into dev, and only when web (or a shared package it
    # consumes) changed. Skipped on dev->main promotion PRs (that change is already
    # live on staging, and overlapping uploads cause Vercel cancellations), on
    # API/worker/CI-only PRs, and on forks (no secrets -> the deploy would fail).
    # Replaces Vercel's own Git auto-preview now that Actions owns deploys.
    if: |
      github.base_ref == 'dev' &&
      needs.detect-changes.outputs.web == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@indexfolio/knowledge-graph --filter=@indexfolio/tax-engine --filter=@indexfolio/etf-types

      - name: Pull Vercel environment
        run: pnpm exec vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          # Retry transient "Upload aborted" failures with backoff (see deploy-web.yml).
          attempts=5
          n=1
          until deploy_url=$(pnpm exec vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}); do
            if [ "$n" -ge "$attempts" ]; then
              echo "::error::vercel deploy failed after $attempts attempts"
              exit 1
            fi
            wait=$((n * 15))
            echo "::warning::vercel deploy failed (attempt $n/$attempts) - retrying in ${wait}s (usually a transient 'Upload aborted')"
            sleep "$wait"
            n=$((n + 1))
          done
          echo "🔎 Preview live at $deploy_url"
          echo "## 🔎 Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Preview:** $deploy_url" >> "$GITHUB_STEP_SUMMARY"
