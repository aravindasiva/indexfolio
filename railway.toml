# Railway config-as-code: build + deploy settings live in the repo, not the dashboard.
# startCommand mirrors the Dockerfile CMD so it overrides the old dashboard start command.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "node_modules/.bin/prisma migrate deploy && node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
